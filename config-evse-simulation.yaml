# EVerest EVSE Simulation Configuration
# Simplified simulation without OCPP - based on config-sil.yaml

active_modules:
  # Yeti hardware simulator
  yeti:
    module: YetiSimulator
    config_module:
      connector_id: 1
    
  # SLAC implementation for WhiteBeet via proxy
  # Note: Requires slac-proxy service running to create slac0 interface
  slac:
    module: EvseSlac
    config_implementation:
      main:
        device: slac0
        number_of_sounds: 10
        ac_mode_five_percent: true
        set_key_timeout_ms: 1000
  # ISO15118 charger
  iso15118_charger:
    module: EvseV2G
    config_module:
      device: eth0
      tls_security: prohibit
      supported_DIN70121: false
      supported_ISO15118_2: true
    connections:
      security:
        - module_id: evse_security
          implementation_id: main
  
  # EVSE manager
  evse_manager:
    module: EvseManager
    config_module:
      connector_id: 1
      has_ventilation: false
      evse_id: UK*TST*E1234567*1
      payment_enable_eim: true
      payment_enable_contract: false
      ac_nominal_voltage: 230
      ac_hlc_enabled: true
      ac_hlc_use_5percent: false
      charge_mode: AC
      session_logging: true
      session_logging_path: /tmp/everest-logs
    connections:
      bsp:
        - module_id: yeti
          implementation_id: board_support
      powermeter_grid_side:
        - module_id: yeti
          implementation_id: powermeter
      hlc:
        - module_id: iso15118_charger
          implementation_id: charger
      slac:
        - module_id: slac
          implementation_id: main
      connector_lock:
        - module_id: yeti
          implementation_id: connector_lock
  
  # Authentication
  auth:
    module: Auth
    config_module:
      connection_timeout: 10
      selection_algorithm: FindFirst
    connections:
      token_provider:
        - module_id: token_provider
          implementation_id: main
      token_validator:
        - module_id: token_validator
          implementation_id: main
      evse_manager:
        - module_id: evse_manager
          implementation_id: evse
  
  token_provider:
    module: DummyTokenProvider
    config_implementation:
      main:
        timeout: 10
        token: DEADBEEF
    connections:
      evse:
        - module_id: evse_manager
          implementation_id: evse
  
  token_validator:
    module: DummyTokenValidator
    config_implementation:
      main:
        sleep: 0.25
        validation_reason: Token seems valid
        validation_result: Accepted
  
  # Security module for certificate management
  evse_security:
    module: EvseSecurity
    config_module:
      private_key_password: "123456"
  
  system:
    module: System

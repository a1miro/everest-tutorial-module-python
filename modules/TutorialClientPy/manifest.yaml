description: A client module that uses the TutorialModulePy via interface_tutorial_module
config:
  client_name:
    description: Name identifier for this client instance.
    type: string
    default: "DefaultClient"
  poll_interval_seconds:
    description: How often to poll the tutorial module (in seconds).
    type: number
    default: 10
provides:
  main:
    description: Internal implementation (module has no external interface)
    interface: empty
    config: {}
requires:
  tutorial_interface:
    interface: interface_tutorial_module
enable_external_mqtt: false
metadata:
